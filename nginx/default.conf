server {
  listen 8081;
  server_name _;

  root /usr/share/nginx/html;

  # Landing page (public root)
  location = / {
    try_files /landing.html =404;
  }

  # Login page
  location = /login {
    try_files /login.html =404;
  }

  # Player home (authenticated)
  location = /home {
    try_files /home.html =404;
  }

  # Settings page (authenticated)
  location = /settings {
    try_files /settings.html =404;
  }

  # Static assets
  location / {
    try_files $uri $uri/ =404;
  }

  # OME HLS proxy
  location /app/ {
    proxy_pass http://127.0.0.1:3333/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
  }

  # Restream API proxy
  location /api/restream/ {
    client_max_body_size 1024m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8099/api/restream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
