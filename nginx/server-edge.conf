# Per-server edge (Model B).
#
# Serves ONE tenant's worker API + OME playback over TLS. Deployed on each
# streaming server alongside `relay` + `ome` + `worker`. The central control
# plane (auth/users/servers) is NOT proxied here — it lives on the control host.
#
# The worker runs on host networking (127.0.0.1:8099); OME publishes 127.0.0.1:3333.
# Replace `server_name` and cert paths at provision time (see scripts/provision-server.sh).

server {
  listen 443 ssl http2;
  server_name srv-XXXX.stream.example.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # Worker WebSocket — live logs + destination status
  location /api/restream/ws {
    proxy_pass http://127.0.0.1:8099/api/restream/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Worker API (streaming workflows)
  location /api/restream/ {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:8099/api/restream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Clip upload + SSE progress
  location /api/clips/ {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    proxy_pass http://127.0.0.1:8099/api/clips/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # OME playback (LL-HLS / WebRTC signalling)
  location /app/ {
    proxy_pass http://127.0.0.1:3333/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
  }
}
