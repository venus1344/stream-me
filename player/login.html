<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — OME Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
    <style>
      *, ::before, ::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #050505;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: #F7F7F7;
      }
      .glow-red {
        position: absolute;
        width: 600px; height: 450px;
        right: -100px; top: -150px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, #d9772a2e 0%, transparent 100%);
        pointer-events: none;
      }
      .glow-blue {
        position: absolute;
        width: 500px; height: 400px;
        left: -100px; bottom: -100px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, #4da3ff1f 0%, transparent 100%);
        pointer-events: none;
      }
      .login-container {
        position: relative; z-index: 2;
        width: min(400px, calc(100% - 40px));
        background: #101114;
        border: 1px solid #292D35;
        border-radius: 20px;
        padding: 40px 32px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .branding {
        display: flex; align-items: center; gap: 10px;
      }
      .logo-box {
        width: 36px; height: 36px;
        background: #D9772A;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
      }
      .logo-box svg { width: 12px; height: 16px; }
      .brand-text {
        font-size: 20px; font-weight: 900;
      }
      .form-header h1 {
        margin: 0; font-size: 28px; font-weight: 900;
      }
      .form-header p {
        margin: 8px 0 0; font-size: 14px; color: #9BA3AF;
      }
      .field { display: flex; flex-direction: column; gap: 8px; }
      .field label {
        font-size: 11px; font-weight: 900;
        letter-spacing: 0.8px; color: #9BA3AF;
        text-transform: uppercase;
      }
      .field input {
        width: 100%;
        background: #07080C;
        border: 1px solid #343A46;
        border-radius: 12px;
        padding: 13px 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: #F7F7F7;
        outline: none;
        transition: border-color 0.2s;
      }
      .field input::placeholder { color: #4B5563; }
      .field input:focus { border-color: #4DA3FF; }
      .field .input-wrap {
        position: relative;
      }
      .field .input-wrap .toggle-pw {
        position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        background: none; border: none; color: #9BA3AF; cursor: pointer;
        font-size: 16px; padding: 0;
      }
      .btn-primary {
        width: 100%;
        background: #D9772A;
        border: none;
        border-radius: 12px;
        padding: 15px 18px;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 15px;
        font-weight: 900;
        color: #FFFFFF;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn-primary:hover { opacity: 0.9; }
      .forgot-link {
        font-size: 13px; color: #4DA3FF;
        text-decoration: none;
      }
      .forgot-link:hover { text-decoration: underline; }
      .divider {
        display: flex; align-items: center; gap: 12px; width: 100%;
      }
      .divider span {
        font-size: 11px; color: #9BA3AF; white-space: nowrap;
      }
      .divider::before, .divider::after {
        content: ""; flex: 1; height: 1px; background: #292D35;
      }
      .bottom-links {
        display: flex; gap: 4px; justify-content: center;
        font-size: 13px;
      }
      .bottom-links span { color: #9BA3AF; }
      .bottom-links a {
        color: #4DA3FF; font-weight: 900;
        text-decoration: none;
      }
      .bottom-links a:hover { text-decoration: underline; }
      .error-msg {
        font-size: 12px; color: #ff7b7b;
        margin-top: -4px;
        display: none;
      }
      #otp-section { display: none; }
      #password-section { display: none; }
    </style>
  </head>
  <body>
    <div class="glow-red"></div>
    <div class="glow-blue"></div>

    <div class="login-container">
      <a href="/" class="branding" style="text-decoration:none;color:inherit">
        <div class="logo-box">
          <svg viewBox="0 0 12 16" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0l12 8-12 8z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div class="brand-text">OME Player</div>
      </a>

      <div class="form-header">
        <h1>Sign In</h1>
        <p>Access your streaming dashboard</p>
      </div>

      <form id="login-form" onsubmit="return false">
        <div class="field">
          <label for="identity">Email or Phone</label>
          <input type="text" id="identity" name="identity" placeholder="user@example.com or +1 555 000 0000" autocomplete="username" />
        </div>

        <div id="password-section" class="field" style="margin-top:20px">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-pw" onclick="togglePassword()">👁</button>
          </div>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <div id="otp-section" class="field" style="margin-top:20px">
          <label for="otp">Enter 6-digit code</label>
          <input type="text" id="otp" name="otp" placeholder="000000" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
          <span id="resend-timer" style="font-size:12px;color:#9BA3AF">Resend code in <span id="countdown">60</span>s</span>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <button type="submit" class="btn-primary" id="submit-btn" style="margin-top:20px">Continue</button>
      </form>

      <div class="divider"><span>or use phone OTP</span></div>

      <div class="bottom-links">
        <span>Don't have an account?</span>
        <a href="/">Start Free Trial</a>
      </div>
    </div>

    <script>
      const identityInput = document.getElementById('identity');
      const passwordSection = document.getElementById('password-section');
      const otpSection = document.getElementById('otp-section');
      const submitBtn = document.getElementById('submit-btn');
      const form = document.getElementById('login-form');
      const errorMsg = document.getElementById('error-msg');

      let authMode = null; // 'email' or 'phone'
      let otpSent = false;

      function isEmail(val) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
      }

      function isPhone(val) {
        return /^\+?\d[\d\s\-()]{7,}$/.test(val.trim());
      }

      identityInput.addEventListener('input', function() {
        const val = this.value.trim();
        errorMsg.style.display = 'none';

        if (isEmail(val)) {
          authMode = 'email';
          passwordSection.style.display = 'flex';
          otpSection.style.display = 'none';
          submitBtn.textContent = 'Sign In';
          document.querySelector('.divider span').textContent = 'or use phone OTP';
        } else if (isPhone(val)) {
          authMode = 'phone';
          passwordSection.style.display = 'none';
          if (!otpSent) {
            submitBtn.textContent = 'Send OTP';
          }
          document.querySelector('.divider span').textContent = 'or use email & password';
        } else {
          authMode = null;
          passwordSection.style.display = 'none';
          otpSection.style.display = 'none';
          submitBtn.textContent = 'Continue';
        }
      });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const val = identityInput.value.trim();

        if (!val) {
          showError('Please enter your email or phone number');
          return;
        }

        if (authMode === 'email') {
          const pw = document.getElementById('password').value;
          if (!pw) {
            showError('Please enter your password');
            return;
          }
          // Simulate login
          sessionStorage.setItem('ome_auth', '1');
          window.location.href = '/home';
        } else if (authMode === 'phone') {
          if (!otpSent) {
            // Simulate sending OTP
            otpSent = true;
            otpSection.style.display = 'flex';
            submitBtn.textContent = 'Verify OTP';
            startCountdown();
          } else {
            const otp = document.getElementById('otp').value;
            if (!otp || otp.length < 6) {
              showError('Please enter the 6-digit code');
              return;
            }
            // Simulate OTP verification
            sessionStorage.setItem('ome_auth', '1');
            window.location.href = '/home';
          }
        } else {
          showError('Please enter a valid email or phone number');
        }
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      }

      function togglePassword() {
        const pw = document.getElementById('password');
        pw.type = pw.type === 'password' ? 'text' : 'password';
      }

      function startCountdown() {
        let seconds = 60;
        const el = document.getElementById('countdown');
        const timer = setInterval(() => {
          seconds--;
          el.textContent = seconds;
          if (seconds <= 0) {
            clearInterval(timer);
            document.getElementById('resend-timer').innerHTML = '<a href="#" onclick="resendOtp()" style="color:#4DA3FF;font-size:12px">Resend code</a>';
          }
        }, 1000);
      }

      function resendOtp() {
        otpSent = false;
        otpSection.style.display = 'none';
        submitBtn.textContent = 'Send OTP';
        document.getElementById('resend-timer').innerHTML = 'Resend code in <span id="countdown">60</span>s';
      }
    </script>
  </body>
</html>
