networks:
  server-net:
    driver: bridge

services:

  # ── SERVER (central platform) ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ome-postgres
    restart: unless-stopped
    profiles: [ server ]
    networks: [ server-net ]
    env_file: .env
    environment:
      POSTGRES_DB: beamcast
      POSTGRES_USER: beamcast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U beamcast" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ome-redis
    restart: unless-stopped
    profiles: [ server ]
    networks: [ server-net ]
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    container_name: ome-api
    restart: unless-stopped
    profiles: [ server ]
    networks: [ server-net ]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://beamcast:${POSTGRES_PASSWORD}@postgres/beamcast
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── WORKER (per-server streaming agent) ───────────────────────────────────

  ome:
    platform: linux/amd64
    image: airensoft/ovenmediaengine:latest
    container_name: ome
    restart: unless-stopped
    profiles: [ worker ]
    env_file: .env
    ports:
      - "1935:1935"
      - "3333:3333"
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "10000:10000/tcp"
      - "10000-10010:10000-10010/udp"
    volumes:
      - ./conf/Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro

  relay-rtmp:
    image: alfg/nginx-rtmp
    container_name: ome-relay-rtmp
    restart: unless-stopped
    profiles: [ worker ]
    command: [ "nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf" ]
    ports:
      - "1936:1935"
    volumes:
      - ./relay/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ome

  worker:
    build:
      context: ./worker
    container_name: ome-worker
    restart: unless-stopped
    profiles: [ worker ]
    ports:
      - "8099:8099"
    env_file: .env
    environment:
      RESTREAM_CONTROL_PORT: "8099"
    volumes:
      - ./worker/data:/data
    depends_on:
      - relay-rtmp
      - ome

  ingester:
    image: jrottenberg/ffmpeg:latest
    container_name: ome-ingester
    restart: unless-stopped
    profiles: [ ingest-copy ]
    depends_on:
      - relay-rtmp
      - ome
    network_mode: host
    entrypoint: /bin/bash -c "while true; do ffmpeg -hide_banner -loglevel info -fflags +genpts -i rtmp://127.0.0.1:1936/stream/input -map 0:v:0 -map 0:a:0? -c copy -f flv rtmp://127.0.0.1:1935/app/key 2>&1 | tee /data/ingester.log; sleep 2; done"
    volumes:
      - ./worker/data:/data

  # ── FRONTEND ──────────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: ome-nginx
    restart: unless-stopped
    profiles: [ frontend ]
    network_mode: host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./player/dist:/usr/share/nginx/html:ro
    depends_on:
      - worker

volumes:
  postgres-data:
